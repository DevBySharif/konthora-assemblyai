# =============================================================================
# Konthora — Frontend server block (konthora.dev.bd + www.konthora.dev.bd)
# =============================================================================
# Serves the self-hosted Next.js production server on 127.0.0.1:3000.
# TLS is terminated here with a Let's Encrypt certificate covering BOTH the
# apex and www domains. HTTP->HTTPS redirect is handled in nginx.conf.
#
# Install:
#   sudo cp konthora.dev.bd.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/konthora.dev.bd.conf \
#              /etc/nginx/sites-enabled/konthora.dev.bd.conf
# =============================================================================

# www -> apex canonical redirect (served over TLS so the redirect is seamless)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.konthora.dev.bd;

    ssl_certificate     /etc/letsencrypt/live/konthora.dev.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konthora.dev.bd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    include /etc/nginx/conf.d/frontend_security_headers.conf;

    return 301 https://konthora.dev.bd$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name konthora.dev.bd;

    ssl_certificate     /etc/letsencrypt/live/konthora.dev.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konthora.dev.bd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    include /etc/nginx/conf.d/frontend_security_headers.conf;

    # Next.js production server (127.0.0.1:3000)
    location / {
        limit_req zone=konthora_web burst=30 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_pass http://konthora_web;
    }

    # Long-cache immutable static assets (hashed by Next.js)
    location /_next/static/ {
        proxy_pass http://konthora_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /favicon.ico {
        proxy_pass http://konthora_web;
        add_header Cache-Control "public, max-age=86400";
    }

    # OpenGraph & Twitter image routes (ensure image responses carry noindex tag)
    location ~* /(opengraph-image|twitter-image) {
        proxy_pass http://konthora_web;
        add_header X-Robots-Tag "noindex" always;
    }
}