# =============================================================================
# Konthora — main Nginx configuration (http context)
# =============================================================================
# Install: copy to /etc/nginx/nginx.conf (Ubuntu 24.04).
#
# Public architecture (fully self-hosted on this VPS):
#   frontend  konthora.dev.bd / www.konthora.dev.bd -> Nginx -> Next.js 127.0.0.1:3000
#   backend   api.konthora.dev.bd -> Nginx -> uvicorn 127.0.0.1:8000
#
# After install, enable site configs with:
#   sudo ln -s /etc/nginx/sites-available/konthora.dev.bd.conf \
#              /etc/nginx/sites-enabled/konthora.dev.bd.conf
#   sudo ln -s /etc/nginx/sites-available/api.konthora.dev.bd.conf \
#              /etc/nginx/sites-enabled/api.konthora.dev.bd.conf
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Basic tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Large upload support: transcription accepts up to 100 MB; add headroom.
    client_max_body_size 110m;

    # ---- Rate-limit zones (defense-in-depth; backend also rate limits by IP) ----
    # General API calls: 30 req/s per IP, burst 40.
    limit_req_zone $binary_remote_addr zone=konthora_api:10m rate=30r/s;
    # Job creation endpoints (upload / synthesis): 5 req/s per IP, burst 3.
    limit_req_zone $binary_remote_addr zone=konthora_jobs:10m rate=5r/s;
    # Frontend (Next.js): generous static/site burst so normal browsing is
    # never throttled while still blocking scraper floods.
    limit_req_zone $binary_remote_addr zone=konthora_web:10m rate=10r/s;

    # ---- Logging ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ---- Compression (only textual content; audio is served uncompressed) ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ---- Upstreams ----
    # Backend: uvicorn bound to localhost.
    upstream konthora_api {
        server 127.0.0.1:8000;
        keepalive 16;
    }
    # Frontend: Next.js production server on localhost.
    upstream konthora_web {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    # Redirect plain HTTP -> HTTPS for the frontend domains served by this VPS.
    server {
        listen 80;
        listen [::]:80;
        server_name konthora.dev.bd www.konthora.dev.bd;
        return 301 https://konthora.dev.bd$request_uri;
    }

    # Redirect plain HTTP -> HTTPS for the API domain served by this VPS.
    server {
        listen 80;
        listen [::]:80;
        server_name api.konthora.dev.bd;
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/sites-enabled/*.conf;
}