# Konthora — shared security response headers for the Nginx frontend server.
# Included from the konthora.dev.bd HTTPS server block. The frontend is a
# Next.js SPA-ish app served from konthora.dev.bd; the CSP allows same-origin
# assets and a single API origin, unlike the API's default-src 'none'.
#
# Install: copy to /etc/nginx/conf.d/frontend_security_headers.conf

# Prevent MIME-type sniffing and content downgrades
add_header X-Content-Type-Options "nosniff" always;

# Block framing of the site in other documents
add_header X-Frame-Options "DENY" always;

# Only send a trimmed Referer on cross-origin requests
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable browser features the frontend does not use (mic/camera are NOT used;
# file upload transcription is handled by the backend)
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

# Frontend CSP: same-origin scripts/styles/fonts/images, allow inline styles
# emitted by Next.js, allow connections to self, the API origin, Google Analytics
# (GTM/GTag beacon + gtag.js loader) and Microsoft Clarity. frame-ancestors 'none'
# + base-uri 'self' block framing and base-tag injection. Only the minimum domains
# required by the two analytics providers and the official Product Hunt badge image
# are allowed; script-src has no unsafe-eval.
#
# Microsoft Clarity origins: the tag loads clarity.js from scripts.clarity.ms,
# sends beacons/pixels to c.clarity.ms, uploads sessions to b.clarity.ms, uses the
# event API api.clarity.ms, and the tag/static assets from www.clarity.ms +
# static.clarity.ms (incl. fonts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms https://static.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.producthunt.com https://www.google-analytics.com https://www.googletagmanager.com https://www.clarity.ms https://c.clarity.ms https://c.bing.com www.google.com; font-src 'self' https://www.clarity.ms https://static.clarity.ms; connect-src 'self' https://api.konthora.dev.bd https://www.google-analytics.com https://www.googletagmanager.com https://analytics.google.com https://*.google.com https://*.googletagmanager.com https://www.clarity.ms https://c.clarity.ms https://api.clarity.ms https://b.clarity.ms; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Isolate the frontend context
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
