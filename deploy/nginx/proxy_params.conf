# Konthora — shared reverse-proxy parameters for the FastAPI upstream.
# Included from each API location block.
#
# Install: copy to /etc/nginx/proxy_params.conf

proxy_http_version 1.1;

# Preserve the real client address and original scheme. uvicorn is started with
# --proxy-headers --forwarded-allow-ips 127.0.0.1 so it only trusts headers from
# this local proxy. The backend's TRUST_PROXY_HEADERS=true reads X-Forwarded-For
# for per-IP rate limiting.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Keep-alive to the upstream.
proxy_set_header Connection "";

# Timeouts: synthesis + transcription jobs can legitimately run for minutes.
proxy_connect_timeout 5s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;

# Stream large audio/transcript downloads instead of buffering the whole body.
proxy_buffering off;
proxy_request_buffering off;

# Never cache API responses (job data is ephemeral and token-protected).
proxy_no_cache 1;
proxy_cache_bypass 1;

# Cache headers are intentionally left to the backend: it emits
# `Cache-Control: no-store` on job JSON/SRT/VTT/TXT and
# `Cache-Control: private, no-cache` on audio downloads. Nginx does NOT add a
# second Cache-Control header here (duplicate headers would conflict).
