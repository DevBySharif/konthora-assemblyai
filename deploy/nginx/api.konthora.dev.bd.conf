# =============================================================================
# Konthora — API reverse proxy server block (api.konthora.dev.bd)
# =============================================================================
# Install:
#   sudo cp api.konthora.dev.bd.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.konthora.dev.bd.conf \
#              /etc/nginx/sites-enabled/api.konthora.dev.bd.conf
#
# TLS is terminated here with Let's Encrypt certificates. HTTP->HTTPS redirect
# is handled in nginx.conf.
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.konthora.dev.bd;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/api.konthora.dev.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.konthora.dev.bd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    # HSTS (only meaningful on HTTPS; the backend also sets it in APP_ENV=production)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Remaining security headers
    include /etc/nginx/conf.d/security_headers.conf;

    # ---- Root: general API traffic ----
    location / {
        limit_req zone=konthora_api burst=40 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://konthora_api;
    }

    # ---- Job creation endpoints: tighter flood protection (uploads / synthesis) ----
    location ~ ^/api/v1/(tts/jobs|transcription/jobs)(/)?$ {
        limit_req zone=konthora_jobs burst=3 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://konthora_api;
    }

    # ---- Health check: no rate limiting so monitors are never throttled ----
    location = /api/v1/health {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://konthora_api;
    }
}
