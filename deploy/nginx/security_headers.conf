# Konthora — shared security response headers for Nginx.
# Included from each HTTPS server block. The FastAPI backend also sets an
# equivalent set; these run first at the edge.
#
# Install: copy to /etc/nginx/conf.d/security_headers.conf

# Prevent MIME-type sniffing and content downgrades
add_header X-Content-Type-Options "nosniff" always;

# Block framing of the site in other documents
add_header X-Frame-Options "DENY" always;

# Only send a trimmed Referer on cross-origin requests
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable browser features the API does not need
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

# API responses are JSON or binary downloads — no inline/embedded content allowed
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

# Isolate the API context
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;

# Prevent search engine indexing of backend API endpoints
add_header X-Robots-Tag "noindex, nofollow" always;
